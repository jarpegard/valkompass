<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kampanjen – Wermlands Mejeri</title>
  <meta name="description" content="Filmen och affischerna bakom Wermlands Mejeris valkampanj." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥛</text></svg>" />
  <link rel="stylesheet" href="css/styles.css?v=20260828b" />
</head>
<body>
  <div class="app">
    <header class="app__header">
      <img
        class="app__logo"
        src="assets/brand/wermlands-mejeri-logo-full.png"
        alt="Wermlands Mejeri – från en ko nära dig"
        width="636"
        height="827"
      />
      <div class="app__header-text">
        <h1 class="app__title">Kampanjen</h1>
      </div>
    </header>

    <main class="app__main">
      <section class="screen screen--active">
        <div class="card">
          <p class="intro__body" style="margin-bottom: 24px;">
            Det här är kampanjen som frågorna i valkompassen är hämtade ur – filmen
            och affischerna som synts runt om i Värmland.
          </p>

          <div class="campaign-video">
            <iframe
              src="https://www.youtube.com/embed/f_DkRWAWE6E"
              title="Wermlands Mejeri – kampanjfilm"
              frameborder="0"
              allow="autoplay; fullscreen; picture-in-picture"
              allowfullscreen
            ></iframe>
          </div>

          <ul class="campaign-grid">
            <li>
              <img src="assets/campaign/poster-farg.jpg" alt="Affisch: Välj rött, eller blått, eller grönt." loading="lazy" />
            </li>
            <li>
              <img src="assets/campaign/poster-tillsammans.jpg" alt="Affisch: Tillsammans når vi över 4%-spärren." loading="lazy" />
            </li>
            <li class="campaign-grid__item--portrait">
              <img src="assets/campaign/poster-majoritet.jpg" alt="Affisch: Vi går för egen majoritet!" loading="lazy" />
            </li>
            <li class="campaign-grid__item--portrait">
              <img src="assets/campaign/poster-storstan.jpg" alt="Affisch: Låt inte storstan' mjölka dig." loading="lazy" />
            </li>
            <li>
              <img src="assets/campaign/poster-koalition.jpg" alt="Affisch: En värmländsk ko-alition." loading="lazy" />
            </li>
          </ul>

          <div class="result__actions" style="margin-top: 24px;">
            <a href="index.html" class="btn btn--ghost">← Tillbaka till valkompassen</a>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
